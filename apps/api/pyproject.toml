[project]
name = "api"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "alembic>=1.13",
    "beautifulsoup4>=4.12",
    "fastapi[standard]>=0.128.8",
    "numpy>=1.26",
    "openai>=1.60",
    "psycopg[binary]>=3.1",
    "pydantic-settings>=2.11.0",
    "sqlalchemy>=2.0",
]
[tool.fastapi]
entrypoint = "app.main:app"
